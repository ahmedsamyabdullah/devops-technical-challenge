image:
  repository: simple-backend
  tag: v1
  pullPolicy: IfNotPresent # Image is local not Docker Hub

service:
  type: ClusterIP
  port: 8080

appConfig:
  # The name of redis svc = my-redis-redis
  redisHost: "my-redis-redis"
  redisPort: "6379"

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi